worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # Use the mime.types file from your local nginx installation
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    upstream php_farm {
        # If php-fpm listens on TCP:
        server 127.0.0.1:9000;
        # If you use a unix socket instead, use:
        # server unix:/path/to/your/php-fpm.sock;
    }

    server {
        listen       8080;
        server_name  localhost;

        root   html;
        index  index.php index.html index.htm;

        location / {
            try_files $uri $uri/ /index.php?$args;
        }
        # === Instance data: never served as static files =======================
        # <app>/var/ (and its rotated "var-<guid>" form) holds the SQLite
        # database, uploaded files, logs, templates and the generated worktable
        # configuration. The .htaccess inside that directory only works on
        # Apache; nginx ignores it, so without this rule the database can be
        # downloaded by anyone, with no session.
        #
        # This must stay BEFORE the "\.php$" block: nginx tries regex locations
        # in the order they appear, so a rule placed further down would let
        # var/config.php be executed instead of denied.
        #
        # The regex has to be quoted. Unquoted, nginx reads the "{" of "{32}" as
        # the start of a block, truncates the expression and refuses to start
        # ("pcre2_compile() failed: missing closing parenthesis").
        location ~ "/app/[^/]+/var(-[0-9a-f]{32})?/" {
            deny all;
        }

        # Dotfiles: .env with plaintext credentials, .htaccess, .git and friends.
        # Two exceptions: /.well-known/ for ACME certificate renewals, and
        # *.example files, which are public templates the worktable plugin lets
        # you download.
        location ~ "/\.(?!well-known)(?!.*\.example$)" {
            deny all;
        }


        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        location ~ \.php$ {
            client_max_body_size 24M;

            fastcgi_pass   php_farm;
            fastcgi_index  index.php;

            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;

            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
            fastcgi_read_timeout 900;
            fastcgi_keep_conn on;

            # If nginx complains about these, simply remove them:
            #proxy_buffering off;
            #gzip off;
        }

        location ~ /app/(?<var1>.*)/cf_api.php/ {
            root   html;
            index  index.php index.html index.htm;

            try_files $uri $uri/ /app/$var1/cf_api.php$is_args$args;
        }
    }
}
