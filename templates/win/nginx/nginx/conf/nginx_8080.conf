
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    upstream php_farm {
        server 127.0.0.1:9000 weight=1;
        server 127.0.0.1:9001 weight=1;
        server 127.0.0.1:9002 weight=1;
        server 127.0.0.1:9003 weight=1;
    }


    server {
        listen       8080;
        server_name  localhost;

        #charset koi8-r;

        #access_log  logs/host.access.log  main;

        location / {
            root   html;
            index  index.html index.htm index.php;
        }
        # === Instance data: never served as static files =======================
        # <app>/var/ (and its rotated "var-<guid>" form) holds the SQLite
        # database, uploaded files, logs, templates and the generated worktable
        # configuration. The .htaccess inside that directory only works on
        # Apache; nginx ignores it, so without this rule the database can be
        # downloaded by anyone, with no session.
        #
        # This must stay BEFORE the "\.php$" block: nginx tries regex locations
        # in the order they appear, so a rule placed further down would let
        # var/config.php be executed instead of denied.
        #
        # The regex has to be quoted. Unquoted, nginx reads the "{" of "{32}" as
        # the start of a block, truncates the expression and refuses to start
        # ("pcre2_compile() failed: missing closing parenthesis").
        location ~ "/app/[^/]+/var(-[0-9a-f]{32})?/" {
            deny all;
        }

        # Dotfiles: .env with plaintext credentials, .htaccess, .git and friends.
        # Two exceptions: /.well-known/ for ACME certificate renewals, and
        # *.example files, which are public templates the worktable plugin lets
        # you download.
        location ~ "/\.(?!well-known)(?!.*\.example$)" {
            deny all;
        }


